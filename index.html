<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>數學能力評估</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f0ebf8;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 580px;
      background: white;
      border-top: 10px solid #673ab7;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    .content {
      padding: 32px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
      color: #0f172a;
    }

    h2 {
      font-size: 28px;
      margin: 0;
    }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    input {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      outline: none;
      margin: 16px 0;
    }

    input:focus {
      border-color: #673ab7;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .primary {
      background: #673ab7;
      color: white;
    }

    .primary:hover {
      background: #5e35b1;
    }

    .primary:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    .secondary {
      background: #f1f5f9;
      color: #475569;
    }

    .secondary:hover {
      background: #e2e8f0;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 32px;
      color: #64748b;
      font-size: 14px;
    }

    .badge {
      color: #673ab7;
      background: #f3e8ff;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: bold;
    }

    .question {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    .options {
      display: grid;
      gap: 16px;
    }

    .option {
      background: white;
      color: #1e293b;
      border: 2px solid #e2e8f0;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .option:hover {
      border-color: #673ab7;
      background: #f3e8ff;
    }

    .letter {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #673ab7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .result {
      text-align: center;
      padding: 24px 0;
    }

    .icon {
      width: 84px;
      height: 84px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #f3e8ff;
      color: #673ab7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    .score {
      font-size: 64px;
      font-weight: 900;
      color: #673ab7;
      margin: 24px 0 8px;
    }

    .score span {
      font-size: 22px;
      color: #94a3b8;
      margin-left: 4px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="content" id="app"></div>
  </main>

  <script>
    const quizData = [
      {
        id: 1,
        question: "因式分解多項式：-24a³b² - 8ab",
        options: [
          "-8ab(3a²b + 1)",
          "-8ab(3a²b - 1)",
          "-8a²b(3ab + 1)",
          "8ab(-3a²b + 1)"
        ],
        answer: 0
      },
      {
        id: 2,
        question: "若大廈 AB = h，且 ∠ADB = 40°，則 BD 的長度為？",
        options: [
          "h * tan 40°",
          "h / tan 40°",
          "h * sin 40°",
          "h / cos 40°"
        ],
        answer: 1
      },
      {
        id: 3,
        question: "計算圖中大廈的高 h (CD = 15m, ∠ADB = 40°, ∠ACB = 35°)",
        options: ["50.21 m", "45.67 m", "63.54 m", "35.82 m"],
        answer: 2
      }
    ];

    const GOOGLE_FORM_URL =
      "https://docs.google.com/forms/d/e/1FAIpQLSdF4d__IhZ1XqwJik78ikxT4Mm55eg_xR8W7piRuHLTniKakg/formResponse";

    const ENTRY_NAME = "entry.118802991";
    const ENTRY_SCORE = "entry.1507697808";

    let view = "student-entry";
    let studentName = "";
    let currentIdx = 0;
    let score = 0;
    let isSubmitting = false;

    const app = document.getElementById("app");

    function submitToGoogleForm(name, finalScore) {
      isSubmitting = true;
      render();

      const formData = new FormData();
      formData.append(ENTRY_NAME, name);
      formData.append(ENTRY_SCORE, String(finalScore));

      fetch(GOOGLE_FORM_URL, {
        method: "POST",
        mode: "no-cors",
        body: formData
      })
        .then(() => {
          console.log("數據已發送至 Google Form");
        })
        .catch((error) => {
          console.error("發送失敗", error);
        })
        .finally(() => {
          isSubmitting = false;
          render();
        });
    }

    function startQuiz() {
      const input = document.getElementById("studentName");
      studentName = input.value.trim();

      if (!studentName) return;

      view = "quiz";
      render();
    }

    function answerQuestion(index) {
      if (index === quizData[currentIdx].answer) {
        score += 1;
      }

      if (currentIdx < quizData.length - 1) {
        currentIdx += 1;
        render();
      } else {
        const finalScore = Math.round((score / quizData.length) * 100);
        view = "result";
        render();
        submitToGoogleForm(studentName, finalScore);
      }
    }

    function restartQuiz() {
      view = "student-entry";
      studentName = "";
      currentIdx = 0;
      score = 0;
      isSubmitting = false;
      render();
    }

    function renderEntry() {
      app.innerHTML = `
        <h1>數學能力評估</h1>
        <p>請輸入您的真實姓名以開始測驗。結果將自動同步至教師系統。</p>

        <input id="studentName" type="text" placeholder="您的姓名" />

        <button class="primary" onclick="startQuiz()">
          開始作答 ›
        </button>
      `;

      const input = document.getElementById("studentName");
      input.focus();
      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") startQuiz();
      });
    }

    function renderQuiz() {
      const item = quizData[currentIdx];

      app.innerHTML = `
        <div class="top-row">
          <span class="badge">問題 ${currentIdx + 1} / ${quizData.length}</span>
          <span>考生：${studentName}</span>
        </div>

        <div class="question">${item.question}</div>

        <div class="options">
          ${item.options.map((option, index) => `
            <button class="option" onclick="answerQuestion(${index})">
              <span class="letter">${String.fromCharCode(65 + index)}</span>
              <span>${option}</span>
            </button>
          `).join("")}
        </div>
      `;
    }

    function renderResult() {
      const finalScore = Math.round((score / quizData.length) * 100);

      app.innerHTML = `
        <div class="result">
          <div class="icon">◔</div>

          <h2>提交成功！</h2>

          <div class="score">
            ${finalScore}<span>分</span>
          </div>

          <p>
            ${isSubmitting ? "數據同步中..." : "測驗已完成，系統已嘗試同步您的回應"}
          </p>

          <button class="secondary" onclick="restartQuiz()">
            返回首頁
          </button>
        </div>
      `;
    }

    function render() {
      if (view === "student-entry") renderEntry();
      if (view === "quiz") renderQuiz();
      if (view === "result") renderResult();
    }

    render();
  </script>
</body>
</html>
